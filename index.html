<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رسالة لشوشو 💜</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    overflow-x:hidden;
    font-family:Tahoma, Arial, sans-serif;
    background:
        radial-gradient(circle at 20% 20%, rgba(180,120,255,.18), transparent 30%),
        radial-gradient(circle at 80% 80%, rgba(255,120,220,.12), transparent 30%),
        linear-gradient(135deg,#10051c,#241039,#12051f);
    color:white;
}

/* طبقة اللمعات */
.glow{
    position:fixed;
    width:7px;
    height:7px;
    border-radius:50%;
    background:rgba(255,255,255,.8);
    box-shadow:0 0 15px #fff,0 0 25px #d7aaff;
    animation:twinkle 3s infinite ease-in-out;
    z-index:0;
}

@keyframes twinkle{
    0%,100%{opacity:.15;transform:scale(.7)}
    50%{opacity:1;transform:scale(1.4)}
}

/* الورد النازل */
.flower{
    position:fixed;
    top:-60px;
    z-index:5;
    pointer-events:none;
    font-size:25px;
    opacity:.85;
    animation:fall linear forwards;
}

@keyframes fall{
    0%{
        transform:translateY(-60px) rotate(0deg);
        opacity:0;
    }
    10%{
        opacity:.9;
    }
    50%{
        transform:translateY(50vh) translateX(35px) rotate(180deg);
    }
    100%{
        transform:translateY(110vh) translateX(-35px) rotate(360deg);
        opacity:0;
    }
}

/* الشاشة الأولى */
.welcome{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    z-index:20;
    background:rgba(12,3,22,.93);
    transition:1s ease;
}

.welcome.hide{
    opacity:0;
    pointer-events:none;
}

.welcome-box{
    width:min(420px,100%);
    padding:35px 25px;
    text-align:center;
    border:1px solid rgba(255,255,255,.18);
    border-radius:30px;
    background:rgba(255,255,255,.07);
    backdrop-filter:blur(18px);
    box-shadow:0 0 40px rgba(180,100,255,.18);
}

.welcome-box h1{
    font-size:30px;
    margin-bottom:15px;
}

.welcome-box p{
    color:#ddd;
    line-height:2;
    margin-bottom:25px;
}

.start{
    border:0;
    padding:14px 35px;
    border-radius:50px;
    color:white;
    background:linear-gradient(135deg,#9b55d9,#d17be9);
    font-size:17px;
    cursor:pointer;
    box-shadow:0 0 25px rgba(205,130,255,.35);
}

/* المحتوى */
.main{
    position:relative;
    z-index:3;
    width:min(650px,92%);
    margin:auto;
    padding:45px 0 80px;
}

.card{
    padding:28px 22px;
    border-radius:30px;
    background:rgba(255,255,255,.075);
    border:1px solid rgba(255,255,255,.13);
    backdrop-filter:blur(16px);
    box-shadow:0 15px 50px rgba(0,0,0,.3);
    text-align:center;
}

.title{
    font-size:28px;
    margin-bottom:12px;
}

.subtitle{
    color:#d9cbe5;
    line-height:1.9;
    margin-bottom:25px;
}

.photo{
    width:100%;
    max-height:430px;
    object-fit:cover;
    border-radius:22px;
    display:block;
    margin:20px auto;
    box-shadow:0 0 30px rgba(190,120,255,.22);
    transition:.7s;
}

.message{
    text-align:right;
    line-height:2.2;
    color:#f5eef9;
    font-size:17px;
    white-space:pre-line;
}

.message-section{
    display:none;
    animation:show .8s ease;
}

.message-section.active{
    display:block;
}

@keyframes show{
    from{
        opacity:0;
        transform:translateY(15px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.next{
    margin-top:25px;
    padding:12px 30px;
    border:1px solid rgba(255,255,255,.2);
    border-radius:50px;
    color:white;
    background:rgba(160,90,210,.25);
    cursor:pointer;
    font-size:16px;
}

.music{
    position:fixed;
    bottom:20px;
    left:20px;
    z-index:15;
    width:52px;
    height:52px;
    border:1px solid rgba(255,255,255,.2);
    border-radius:50%;
    background:rgba(100,45,130,.75);
    color:white;
    font-size:22px;
    cursor:pointer;
    box-shadow:0 0 20px rgba(190,110,255,.3);
}

.final-photos{
    display:grid;
    grid-template
